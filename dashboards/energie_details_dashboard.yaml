# =====================================================================
# LOVELACE-DASHBOARD "Energie-Details"
# Migriert von Storage-Mode nach YAML (2026-08-08) - läuft jetzt direkt
# von der Platte, siehe configuration.yaml (lovelace.dashboards) +
# docker-compose.yml (dashboards/-Verzeichnis-Mount, siehe CLAUDE.md für
# den Hintergrund zum Verzeichnis- vs. Einzeldatei-Mount). Bearbeiten +
# Browser-Reload genügt, kein RAW-Editor-Copy-Paste mehr nötig.
#
# UMBAU 2026-08-10: OBI Energy Tracker (Cloud-Backend, siehe ausführliche
# Ausfall-Historie in CLAUDE.md/Session-Log) ersetzt durch den "bitShake
# SmartMeterReader" - ein Tasmota-ESP32 mit SML-Optokopf, liest denselben
# Zähler lokal per MQTT aus, kein Cloud-Umweg mehr. Karten unten zeigen
# jetzt sensor.stromzaehler_* statt sensor.obi_*. Der Nutzer hat den OBI-
# Tracker danach bewusst komplett stillgelegt (Integration, Config-Entry
# und die zugehörigen Wh/"bereinigt"-Template-Sensoren entfernt) - kein
# Fallback mehr vorgesehen, bitShake ist der endgültige Ersatz.
# =====================================================================

title: Energie-Details
views:
  - title: Energie-Details
    path: default_view
    cards:
      # stat_type "sum" zeigt den relativen Gesamtverbrauch SEIT BEGINN DER
      # AUFZEICHNUNG (fängt bei 0 an) - nicht den echten Zählerstand.
      # "state" ist der tatsächliche Rohwert (Zählerstand) je Periode.
      - type: statistics-graph
        title: Stromverbrauch (5-Minuten-Auflösung)
        entities:
          - sensor.stromzaehler_gesamt
        period: 5minute
        stat_types:
          - state
        days_to_show: 7

      # Momentanleistung: sensor.stromzaehler_leistung liegt technisch bereit
      # (bitShake-Zähler liefert MT174.Power alle 10s), zeigt aber Stand
      # 2026-08-10 durchgehend 0 W. Grund laut Nutzer: die "erweiterte"
      # SML-Datensatzvariante mit echter Momentanleistung ist beim Messstellen-
      # betreiber PIN-gesperrt (nur der öffentliche Teil mit den kumulierten
      # Zählerständen ist ohne PIN lesbar) - Aktivierung/PIN-Anfrage steht
      # noch aus, kein Bug. Karte bleibt trotzdem stehen: sobald der PIN
      # aktiviert ist, füllt sie sich ohne weitere Dashboard-Änderung.
      - type: history-graph
        title: Momentanleistung
        entities:
          - sensor.stromzaehler_leistung
        hours_to_show: 3

      # "Verbrauch letzte Stunde" (2026-08-10 überarbeitet, ursprünglich ein
      # 5-Minuten-"change"-Balkendiagramm). HAs Kurzzeit-Statistik kann nicht
      # feiner als 5-Minuten-Buckets - feste Grenze im Recorder, keine
      # Konfigurationsoption. Für eine Minuten-Auflösung stattdessen der
      # native "statistics"-Sensor sensor.verbrauch_letzte_minute
      # (configuration.yaml, state_characteristic: change, max_age: 1 Min) -
      # rechnet laufend "wieviel Wh kamen in der letzten Minute dazu" direkt
      # aus den ~alle 10s eintreffenden Rohwerten, ohne 5-Minuten-Rundung.
      # history-graph statt statistics-graph, da hier wieder die tatsächlichen
      # Rohwerte interessieren, nicht aggregierte Statistik-Buckets.
      - type: history-graph
        title: Verbrauch letzte Stunde (pro Minute kumuliert)
        entities:
          - sensor.verbrauch_letzte_minute
        hours_to_show: 1
