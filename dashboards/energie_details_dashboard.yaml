# =====================================================================
# LOVELACE-DASHBOARD "Energie-Details"
# Migriert von Storage-Mode nach YAML (2026-08-08) - läuft jetzt direkt
# von der Platte, siehe configuration.yaml (lovelace.dashboards) +
# docker-compose.yml (dashboards/-Verzeichnis-Mount, siehe CLAUDE.md für
# den Hintergrund zum Verzeichnis- vs. Einzeldatei-Mount). Bearbeiten +
# Browser-Reload genügt, kein RAW-Editor-Copy-Paste mehr nötig.
#
# UMBAU 2026-09-20 (vormittags): Zurück auf OBI Energy Tracker - siehe Git-
# Historie, überholt durch den nächsten Umbau direkt am selben Nachmittag.
#
# UMBAU 2026-09-20 (nachmittags), ZURÜCK AUF BITSHAKE: OBI erneut ausgebaut
# (wiederkehrende Backend-Ausfälle wiegen schwerer als die umständliche
# Stromversorgung der bitShake-Hardware, Nutzerentscheidung). Karten unten
# entsprechen wieder dem letzten bekannt-guten bitShake-Stand (Git-Commit
# bee4128, vor dem Vormittags-Revert). custom_components/obi_energy erneut
# deinstalliert, Config-Entry/Entities aufgeräumt, .storage/energy zurück
# auf sensor.stromzaehler_gesamt.
#
# UMBAU 2026-09-26: Gerät wieder in Betrieb (IP 192.168.2.225, jetzt
# dauerhaft/reserviert). Die fünf rohen mqtt:-Sensoren in configuration.yaml
# sind ergänzt (Feldpfade live von der Geräte-HTTP-API bestätigt) und neue
# Karte unten mit Hochtarif/Niedertarif/Einspeisung, die es vorher nie gab.
# WICHTIG, noch offen: Der Mosquitto-Port 1883 ist aktuell trotz laufendem
# Broker von außen nicht erreichbar (Colima-SSH-Portforward-Fehler, siehe
# ausführlichen Befund in configuration.yaml direkt über dem mqtt:-Block) -
# alle sensor.stromzaehler_*-Karten bleiben deshalb bis zu einem Colima-
# Neustart leer/"unavailable", sind aber korrekt verdrahtet und füllen sich
# von selbst, sobald der Broker wieder erreichbar ist.
# =====================================================================

title: Energie-Details
views:
  - title: Energie-Details
    path: default_view
    cards:
      # stat_type "sum" zeigt den relativen Gesamtverbrauch SEIT BEGINN DER
      # AUFZEICHNUNG (fängt bei 0 an) - nicht den echten Zählerstand.
      # "state" ist der tatsächliche Rohwert (Zählerstand) je Periode.
      - type: statistics-graph
        title: Stromverbrauch (5-Minuten-Auflösung)
        entities:
          - sensor.stromzaehler_gesamt
        period: 5minute
        stat_types:
          - state
        days_to_show: 7

      # Zählerstände im Überblick (neu 2026-09-26) - Hochtarif/Niedertarif/
      # Einspeisung gab es als eigene Karte vorher nie, obwohl die
      # zugehörigen MQTT-Sensoren schon seit dem ursprünglichen Setup
      # existieren. Einfache Entities-Karte statt Statistics-Graph, da hier
      # der aktuelle Stand interessiert, nicht der Zeitverlauf (den zeigt
      # die Kurve oben bereits für Gesamt).
      - type: entities
        title: Zählerstände
        entities:
          - entity: sensor.stromzaehler_gesamt
            name: Gesamt
          - entity: sensor.stromzaehler_hochtarif
            name: Hochtarif
          - entity: sensor.stromzaehler_niedertarif
            name: Niedertarif
          - entity: sensor.stromzaehler_einspeisung
            name: Einspeisung

      # Momentanleistung: sensor.stromzaehler_leistung liegt technisch bereit
      # (bitShake-Zähler liefert MT174.Power alle 10s), zeigt aber durchgehend
      # 0 W. Grund: die "erweiterte" SML-Datensatzvariante mit echter
      # Momentanleistung ist beim Messstellenbetreiber PIN-gesperrt (nur der
      # öffentliche Teil mit den kumulierten Zählerständen ist ohne PIN
      # lesbar) - kein Bug, PIN-Aktivierung steht weiterhin aus. Karte bleibt
      # stehen: sobald der PIN aktiviert ist, füllt sie sich ohne weitere
      # Dashboard-Änderung.
      - type: history-graph
        title: Momentanleistung
        entities:
          - sensor.stromzaehler_leistung
        hours_to_show: 3

      # "Verbrauch letzte Stunde": echte Kurve mit ~10s-Auflösung statt
      # aggregierter 5-Minuten-Statistik-Buckets (HAs Kurzzeit-Statistik kann
      # nicht feiner - feste Grenze im Recorder). sensor.stromzahler_
      # differenz_pro_messwert (configuration.yaml, statistics-Sensor,
      # state_characteristic: change, sampling_size: 2) vergleicht bei jedem
      # neuen Messwert nur den aktuellen mit dem direkt vorherigen -
      # rohe Differenz zwischen zwei aufeinanderfolgenden ~10s-Ticks.
      # history-graph statt statistics-graph, da die Rohwerte interessieren,
      # nicht aggregierte Statistik-Buckets. Zeigt sensor.stromzahler_
      # differenz_bereinigt (Wertgrenzen-Filter-Template, 50 Wh/Tick) statt
      # der rohen Statistics-Entity direkt, wegen des dokumentierten Anlauf-
      # Ausreißers direkt nach einem HA-Neustart (leerer Sample-Puffer).
      - type: history-graph
        title: Verbrauch – Differenz je Messwert (~10s)
        entities:
          - sensor.stromzahler_differenz_bereinigt
        hours_to_show: 1

      # "Näherungsleistung" - Watt-Näherung aus der Wh-Differenz zwischen
      # zwei Messwerten mit der ECHTEN Zeitdifferenz zwischen den Ticks
      # (sensor.stromzahler_wh_pro_sekunde, state_characteristic:
      # change_second, *3600 in sensor.stromzahler_naherungsleistung,
      # siehe configuration.yaml). Solange die echte Momentanleistung (Karte
      # oben) PIN-gesperrt ist, gibt das eine ungefähre Vorschau - kein
      # Ersatz für die echte Augenblicksmessung, sondern eine über das
      # jeweilige Tick-Intervall gemittelte Näherung.
      - type: history-graph
        title: Näherungsleistung (aus Wh-Differenz)
        entities:
          - sensor.stromzahler_naherungsleistung
        hours_to_show: 1

      # SwitchBot-Steckdosen (seit 2026-09-19 im Einsatz, 4 Stück), Integration
      # switchbot_cloud, verifiziert per core.entity_registry (2026-09-20).
      # Kein area_id zugewiesen -> Kartentitel/Namen nutzen die SwitchBot-
      # Gerätenamen 1:1. "Klvierzimmer" (fehlendes "a") und "Mini (EU) 3A"
      # (generischer SwitchBot-Modellname statt Raumbezeichnung) kommen so
      # aus der SwitchBot-App/Cloud - nicht korrigiert, da außerhalb dieses
      # Dashboard-Umbaus; bei Bedarf Device in HA umbenennen.
      - type: entities
        title: SwitchBot-Steckdosen – Live-Leistung
        entities:
          - entity: switch.steckdose_klvierzimmer
            name: Klavierzimmer
          - entity: sensor.steckdose_klvierzimmer_leistung
            name: Klavierzimmer – Leistung
          - entity: switch.steckdose_esszimmer
            name: Esszimmer
          - entity: sensor.steckdose_esszimmer_leistung
            name: Esszimmer – Leistung
          - entity: switch.steckdose_avantgarde
            name: Avantgarde
          - entity: sensor.steckdose_avantgarde_leistung
            name: Avantgarde – Leistung
          - entity: switch.steckdose_mini_eu_3a
            name: Mini (EU) 3A
          - entity: sensor.steckdose_mini_eu_3a_leistung
            name: Mini (EU) 3A – Leistung
      # Gleiches Muster wie die OBI-Verbrauchskarte oben (period/stat_types/
      # days_to_show) - alle vier Energie-Sensoren zum direkten Vergleich in
      # einer Grafik statt vier Einzelkarten.
      - type: statistics-graph
        title: SwitchBot-Steckdosen – Energieverbrauch (kWh, 5-Minuten-Auflösung)
        entities:
          - sensor.steckdose_klvierzimmer_energie
          - sensor.steckdose_esszimmer_energie
          - sensor.steckdose_avantgarde_energie
          - sensor.steckdose_mini_eu_3a_energie
        period: 5minute
        stat_types:
          - state
        days_to_show: 7
