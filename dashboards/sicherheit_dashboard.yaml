# =====================================================================
# LOVELACE-DASHBOARD "Sicherheit" – nur die Live-Bilder beider Kameras
#
# Läuft als YAML-Dashboard direkt von der Platte (siehe configuration.yaml
# + docker-compose.yml) -> diese Datei einfach bearbeiten und im Browser
# neu laden, kein Copy-Paste über den RAW-Editor mehr nötig.
#
# Entity-IDs (Stand 2026-08-07):
#   - Wannsee: SwitchBot Pan/Tilt Camera 3K  (camera.wannsee_switchbot_pan_tilt_camera_3k_mainstream)
#   - Dresden: Imou Pan/Tilt-Außenkamera     (camera.imou_profile000)
#
# Bewusst ohne Sensor-Tiles/Buttons/PTZ-Steuerung: PTZ funktioniert bei
# keiner der beiden Kameras zuverlässig über ONVIF (Details siehe
# CLAUDE.md unter "SwitchBot" / "Imou Pan/Tilt-Außenkamera Dresden").
#
# camera_view: live - UNTERSCHIEDLICH GEHANDHABT PRO KAMERA (2026-08-08),
# beide Wege haben eigene Probleme über Tailscale:
#   - Wannsee: BEWUSST OHNE "live". Mit live wird die Vorschau nach ein paar
#     Minuten grau (WebRTC/go2rtc-TURN-Port 18555 nicht freigegeben, kein
#     STUN-Server, siehe CLAUDE.md). Unproblematisch ohne live, da hier nie
#     camera.record dazwischenfunkt (noch nie ausgelöst).
#   - Dresden: MIT "live" (zurückgestellt, erster Versuch ohne live schlug
#     fehl). Ohne live pollt die Karte alle 10s ein frisches HTTP-Standbild
#     per RTSP-Kurzverbindung - kollidiert ständig mit den 30s-Aufnahmen aus
#     camera.record (Bewegung hier sehr häufig), Kamera verträgt vermutlich
#     nur eine RTSP-Verbindung gleichzeitig -> Dauer-Timeouts, Kachel tot.
#     Mit live bleibt es bei einer einzigen persistenten Verbindung statt
#     Dauerpolling - noch nicht bestätigt, ob das über Tailscale auch grau
#     wird wie bei Wannsee, aber weniger aggressiv gegenüber der Kamera.
#
# Ereignisleiste unter jedem Bild: KEIN Standard-Logbook mehr (kann keine
# eigenen Links), sondern eine Markdown-Karte, die aus sensor.kamera_ereignisse
# (Trigger-Template in configuration.yaml, gefüttert vom "kamera_ereignis"-
# Event aus den Aufnahme-Automationen in automations.yaml) eine Liste
# klickbarer Links auf die aufgenommenen MP4-Clips rendert. Letzte 30
# Ereignisse insgesamt (über beide Kameras), hier pro Karte auf die passende
# Kamera gefiltert.
#
# OPTIK: reines Text/Unicode-Timeline (●/│), KEIN HTML/CSS mehr (2026-08-08,
# zweiter Anlauf). Erster Versuch war <div>+<span>+eingebettetes <style> -
# ist gescheitert: HA/marked.js erkennt <style> nur als Raw-HTML-Block, wenn
# es am ZEILENANFANG steht; die YAML-Faltung ("content: >" zieht alle Zeilen
# ohne Leerzeile zu einer zusammen) zerstört genau das, <style> landet dadurch
# als sichtbarer Klartext auf der Karte statt als CSS zu wirken. card_mod
# (würde das zuverlässig lösen) ist nicht installiert, siehe CLAUDE.md.
# Statt dessen: Verkettung über den Jinja-Filter "join('\n\n...\n\n')" -
# echte Zeilenumbrüche entstehen dabei ERST beim Rendern (nicht im YAML-
# Quelltext), die YAML-Faltung kann sie also nicht mehr zerstören.
#
# WICHTIG, schon mal versehentlich verloren gegangen (2026-08-08): Die
# Links MÜSSEN als rohes <a href="..." target="_blank" rel="noopener">
# gebaut werden, NICHT als Markdown-Syntax [text](url) - Markdown-Links
# ohne target="_blank" fängt HAs Frontend als SPA-Navigation ab und landet
# auf der Übersichtsseite statt beim Video. <a> übersteht den Sanitizer
# (bestätigt, im Gegensatz zu <div>/<span>/<style>), nur eben MIT target.
#
# TÜRKONTAKTE (Söller, Eingangstür, Haustür, Haustür Wannsee, Wintergarten):
# Tuya/Smart-Life-Geräte über die Tuya-Cloud-Integration (Schritt-für-Schritt
# war hier früher dokumentiert, Pairing inzwischen erledigt). Stand 2026-08-10:
# 3 von 5 real gepairt und mit Historie (Söller/Terrasse, Eingangstür,
# Haustür) - binary_sensor.haustur_wannsee* und binary_sensor.wintergarten_tur*
# existieren noch NICHT (per direkter DB-Abfrage verifiziert, nicht nur
# angenommen), bleiben unten als vorausschauende Platzhalter stehen und
# fangen einfach an zu funktionieren, sobald das Pairing nachgeholt wird.
# =====================================================================

title: Sicherheit
views:
  - title: Sicherheit
    path: sicherheit
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: picture-entity
            entity: camera.wannsee_switchbot_pan_tilt_camera_3k_mainstream
            name: Wannsee
            show_state: false
            grid_options:
              columns: full
              rows: 4
          - type: markdown
            title: Ereignisse Wannsee
            content: >
              {% set events = (state_attr('sensor.kamera_ereignisse', 'events') or [])
                 | selectattr('kamera', 'eq', 'wannsee') | list %}
              {% if events | length == 0 %}
              _Noch keine Ereignisse aufgezeichnet._
              {% else %}
              {% set ns = namespace(lines=[]) %}
              {% for e in events | reverse %}
              {% set zeit = strptime(e.zeit, '%Y-%m-%d_%H-%M-%S').strftime('%d.%m. %H:%M:%S') %}
              {% set ns.lines = ns.lines + ['<a href="/local/kamera_aufnahmen/' ~ e.dateiname ~ '" target="_blank" rel="noopener">● **' ~ zeit ~ '** — Bewegung erkannt</a>'] %}
              {% endfor %}
              {{ ns.lines | join('\n\n│\n\n') }}
              {% endif %}
            grid_options:
              columns: full
              rows: 4

      - type: grid
        cards:
          - type: picture-entity
            entity: camera.imou_profile000
            name: Dresden
            camera_view: live
            show_state: false
            grid_options:
              columns: full
              rows: 4
          - type: markdown
            title: Ereignisse Dresden
            content: >
              {% set events = (state_attr('sensor.kamera_ereignisse', 'events') or [])
                 | selectattr('kamera', 'eq', 'dresden') | list %}
              {% if events | length == 0 %}
              _Noch keine Ereignisse aufgezeichnet._
              {% else %}
              {% set ns = namespace(lines=[]) %}
              {% for e in events | reverse %}
              {% set zeit = strptime(e.zeit, '%Y-%m-%d_%H-%M-%S').strftime('%d.%m. %H:%M:%S') %}
              {% set ns.lines = ns.lines + ['<a href="/local/kamera_aufnahmen/' ~ e.dateiname ~ '" target="_blank" rel="noopener">● **' ~ zeit ~ '** — Bewegung erkannt</a>'] %}
              {% endfor %}
              {{ ns.lines | join('\n\n│\n\n') }}
              {% endif %}
            grid_options:
              columns: full
              rows: 4

      - type: grid
        cards:
          - type: heading
            heading: Türkontakte
            heading_style: title
          # Ereignishistorie über alle Türkontakte (2026-08-10): native
          # "logbook"-Karte statt eines eigenen Sensors wie bei den Kamera-
          # Ereignissen oben - hier gibt es keine Video-Datei zu verlinken,
          # nur Zustandswechsel (auf/zu, Tamper), dafür reicht HAs eingebautes
          # Logbook. hours_to_show bewusst hoch (7 Tage), weil die Türen nicht
          # ständig auslösen und ein 24h-Fenster oft leer wäre. Haustür
          # Wannsee/Wintergarten sind hier schon mit aufgeführt, obwohl noch
          # nicht gepairt (siehe Kommentar oben) - erscheinen einfach erst,
          # sobald das Pairing nachgeholt ist, kein Fehler bis dahin.
          # Layout 2026-08-10: Logbook wandert von "oben, volle Breite,
          # rows: 4" in eine eigene rechte Spalte neben die 5 Tür-Karten
          # (die dafür in einen vertical-stack links wandern) - dadurch
          # ist die Liste nicht mehr auf 4 feste Grid-Zeilen gedeckelt,
          # sondern nimmt die volle Höhe der linken Spalte ein (5 gestapelte
          # entities-Karten sind deutlich höher als die alten 4 Grid-Zeilen).
          - type: horizontal-stack
            grid_options:
              columns: full
              rows: 10
            cards:
              - type: vertical-stack
                cards:
                  - type: entities
                    title: Söller
                    entities:
                      - entity: binary_sensor.terrasse_tur
                        name: Tür
                      - entity: binary_sensor.terrasse_tamper
                        name: Tamper
                      - entity: sensor.terrasse_batterie
                        name: Batterie
                  - type: entities
                    title: Eingangstür
                    entities:
                      - entity: binary_sensor.eingangstur_tur
                        name: Tür
                      - entity: binary_sensor.eingangstur_tamper
                        name: Tamper
                      - entity: sensor.eingangstur_batterie
                        name: Batterie
                  - type: entities
                    title: Haustür
                    entities:
                      - entity: binary_sensor.haustur_tur
                        name: Tür
                      - entity: binary_sensor.haustur_tamper
                        name: Tamper
                      - entity: sensor.haustur_batterie
                        name: Batterie
                  - type: entities
                    title: Haustür Wannsee
                    entities:
                      - entity: binary_sensor.haustur_wannsee
                        name: Tür
                      - entity: binary_sensor.haustur_wannsee_tamper
                        name: Tamper
                      - entity: sensor.haustur_wannsee_batterie
                        name: Batterie
                  - type: entities
                    title: Wintergarten
                    entities:
                      - entity: binary_sensor.wintergarten_tur
                        name: Tür
                      - entity: binary_sensor.wintergarten_tamper
                        name: Tamper
                      - entity: sensor.wintergarten_batterie
                        name: Batterie
              - type: logbook
                title: Ereignisse Türkontakte
                hours_to_show: 168
                entities:
                  - binary_sensor.terrasse_tur
                  - binary_sensor.terrasse_tamper
                  - binary_sensor.eingangstur_tur
                  - binary_sensor.eingangstur_tamper
                  - binary_sensor.haustur_tur
                  - binary_sensor.haustur_tamper
                  - binary_sensor.haustur_wannsee
                  - binary_sensor.haustur_wannsee_tamper
                  - binary_sensor.wintergarten_tur
                  - binary_sensor.wintergarten_tamper
