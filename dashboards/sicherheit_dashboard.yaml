# =====================================================================
# LOVELACE-DASHBOARD "Sicherheit" – Kamera- und Türübersicht
#
# Läuft als YAML-Dashboard direkt von der Platte (siehe configuration.yaml
# + docker-compose.yml) -> diese Datei einfach bearbeiten und im Browser
# neu laden, kein Copy-Paste über den RAW-Editor mehr nötig.
#
# Entity-IDs (Stand 2026-08-17):
#   - Wannsee: SwitchBot Pan/Tilt Camera 3K  (camera.wannsee_switchbot_pan_tilt_camera_3k_mainstream)
#   - Dresden: Imou Pan/Tilt-Außenkamera     (camera.dresden_vorschau, s.u. 2026-08-17)
#   - Outdoor: SwitchBot Outdoor Pan/Tilt Cam 3K (camera.switchbot_outdoor_pan_tilt_cam_3k_secstream)
#
# Bewusst ohne Sensor-Tiles/Buttons/PTZ-Steuerung: PTZ funktioniert bei
# keiner der beiden Kameras zuverlässig über ONVIF (Details siehe
# CLAUDE.md unter "SwitchBot" / "Imou Pan/Tilt-Außenkamera Dresden").
#
# DRESDEN, GRUNDSÄTZLICHER UMBAU (2026-08-17): Nach tagelangem Hin und Her
# mit camera_view: live (WebRTC/go2rtc-TURN grau, siehe CLAUDE.md) UND ohne
# live (10s-RTSP-Polling überlastete die Kamera bis zum Absturz, ebenfalls
# CLAUDE.md, 2026-08-15/16) komplett auf ein entkoppeltes Standbild-Modell
# umgestellt: camera.dresden_vorschau ist eine local_file-Kamera (siehe
# configuration.yaml), die nur eine lokale JPG-Datei liest - kein Stream,
# keine RTSP-Verbindung, kein WebRTC. Die Datei wird per shell_command über
# den nativen ONVIF-HTTP-Snapshot-Endpunkt aktualisiert: alle 5 Minuten
# automatisch (Automation in automations.yaml) UND sofort bei erkannter
# Bewegung (ergänzt in derselben Automation, die auch den Ereignis-Clip
# aufnimmt). Damit vollständig unabhängig von go2rtc/WebRTC UND ohne jede
# RTSP-Zusatzlast über die ohnehin schon von camera.record genutzte
# Verbindung hinaus - behebt beide bisherigen Fehlerklassen an der Wurzel.
# Wannsee/Outdoor laufen unverändert weiter mit ihrem bisherigen Live/Nicht-
# Live-Ansatz (siehe Kommentare unten), nur Dresden war akut betroffen.
#
# Ereignisleiste unter jedem Bild: KEIN Standard-Logbook mehr (kann keine
# eigenen Links), sondern eine Markdown-Karte, die aus sensor.kamera_ereignisse
# (Trigger-Template in configuration.yaml, gefüttert vom "kamera_ereignis"-
# Event aus den Aufnahme-Automationen in automations.yaml) eine Liste
# klickbarer Links auf die aufgenommenen MP4-Clips rendert. Letzte 30
# Ereignisse insgesamt (über alle drei Kameras), hier pro Karte auf die
# passende Kamera gefiltert.
#
# OPTIK: reines Text/Unicode-Timeline (●/│), KEIN HTML/CSS mehr (2026-08-08,
# zweiter Anlauf). Erster Versuch war <div>+<span>+eingebettetes <style> -
# ist gescheitert: HA/marked.js erkennt <style> nur als Raw-HTML-Block, wenn
# es am ZEILENANFANG steht; die YAML-Faltung ("content: >" zieht alle Zeilen
# ohne Leerzeile zu einer zusammen) zerstört genau das, <style> landet dadurch
# als sichtbarer Klartext auf der Karte statt als CSS zu wirken. card_mod
# (würde das zuverlässig lösen) ist nicht installiert, siehe CLAUDE.md.
# Statt dessen: Verkettung über den Jinja-Filter "join('\n\n...\n\n')" -
# echte Zeilenumbrüche entstehen dabei ERST beim Rendern (nicht im YAML-
# Quelltext), die YAML-Faltung kann sie also nicht mehr zerstören.
#
# WICHTIG, schon mal versehentlich verloren gegangen (2026-08-08): Die
# Links MÜSSEN als rohes <a href="..." target="_blank" rel="noopener">
# gebaut werden, NICHT als Markdown-Syntax [text](url) - Markdown-Links
# ohne target="_blank" fängt HAs Frontend als SPA-Navigation ab und landet
# auf der Übersichtsseite statt beim Video. <a> übersteht den Sanitizer
# (bestätigt, im Gegensatz zu <div>/<span>/<style>), nur eben MIT target.
#
# TÜRKONTAKTE (Söller, Eingangstür, Haustür, Haustür Wannsee, Wintergarten):
# Tuya/Smart-Life-Geräte über die Tuya-Cloud-Integration (Schritt-für-Schritt
# war hier früher dokumentiert, Pairing inzwischen erledigt). Stand 2026-08-10:
# 3 von 5 real gepairt und mit Historie (Söller/Terrasse, Eingangstür,
# Haustür).
#
# STUDIO (2026-08-29): 6. Kontaktsensor, nicht im ursprünglichen 5er-Inventar
# oben. Entity-ID kam generisch als "contact_sensor_4_*" aus dem Pairing,
# analog zu den anderen Türen auf "studio_*" umbenannt (core.entity_registry
# direkt editiert, Container dafür kurz gestoppt).
#
# HAUSTÜR WANNSEE (2026-09-02): war monatelang nicht pairbar - Ursache war
# kein physisches Problem, sondern zwei getrennte Tuya-Konten (Dresden per
# E-Mail, Wannsee per "Bei Apple anmelden" - für Tuya zwei verschiedene
# Konten). Fix über Tuyas eigenes Geräte-Teilen-Feature, siehe CLAUDE.md
# "Türkontakte". Jetzt aktiv, kein Tamper-Sensor bei diesem Gerätemodell.
#
# WINTERGARTEN weiterhin offen: meldet zwar über Alexa (Cloud-zu-Cloud-Link,
# unabhängig von lokalem Alexa-Gerät), taucht aber in KEINEM der beiden
# bekannten Tuya-Konten auf - vermutlich ein drittes, unbekanntes Konto.
# Erst wieder ins Dashboard aufnehmen, sobald die Entity real existiert.
# =====================================================================

title: Sicherheit
views:
  - title: Sicherheit
    path: sicherheit
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: picture-entity
            entity: camera.wannsee_switchbot_pan_tilt_camera_3k_mainstream
            name: Wannsee
            show_state: false
            grid_options:
              columns: full
              rows: 4
          - type: markdown
            title: Ereignisse Wannsee
            content: >
              {% set events = (state_attr('sensor.kamera_ereignisse', 'events') or [])
                 | selectattr('kamera', 'eq', 'wannsee') | list %}
              {% if events | length == 0 %}
              _Noch keine Ereignisse aufgezeichnet._
              {% else %}
              {% set ns = namespace(lines=[]) %}
              {% for e in events | reverse %}
              {% set zeit = strptime(e.zeit, '%Y-%m-%d_%H-%M-%S').strftime('%d.%m. %H:%M:%S') %}
              {% set ns.lines = ns.lines + ['<a href="/local/kamera_aufnahmen/' ~ e.dateiname ~ '" target="_blank" rel="noopener">● **' ~ zeit ~ '** — Bewegung erkannt</a>'] %}
              {% endfor %}
              {{ ns.lines | join('\n\n│\n\n') }}
              {% endif %}
            grid_options:
              columns: full
              rows: 4
          # 2026-08-15: Hue-Sicherheitszone Wannsee ergänzt. Die Hue Bridge Pro
          # (192.168.1.30) hat KEINE eigenen Bewegungs-/Kontaktsensor-Geräte
          # gepairt (device_registry geprüft: nur Lampen + Räume/Zonen) - die
          # einzige sicherheitsrelevante Entity ist der software-seitige
          # "Bewegungsbereich" der Zone "Wohnzimmer Wannsee". Eine eigene
          # Arm/Unarm-Statusanzeige (Hue Secure scharf/unscharf) gibt es in
          # HAs Hue-Integration nicht als Entity - nur diese Bewegungserkennung.
          - type: entities
            title: Hue Sicherheitszone
            entities:
              - entity: binary_sensor.wohnzimmer_wannsee_wohnzimmer_wannsee_bewegungsbereich
                name: Bewegung Wohnzimmer
            grid_options:
              columns: full
              rows: 2

      - type: grid
        cards:
          - type: picture-entity
            entity: camera.dresden_vorschau
            name: Dresden
            show_state: false
            grid_options:
              columns: full
              rows: 4
          - type: markdown
            title: Ereignisse Dresden
            content: >
              {% set events = (state_attr('sensor.kamera_ereignisse', 'events') or [])
                 | selectattr('kamera', 'eq', 'dresden') | list %}
              {% if events | length == 0 %}
              _Noch keine Ereignisse aufgezeichnet._
              {% else %}
              {% set ns = namespace(lines=[]) %}
              {% for e in events | reverse %}
              {% set zeit = strptime(e.zeit, '%Y-%m-%d_%H-%M-%S').strftime('%d.%m. %H:%M:%S') %}
              {% set ns.lines = ns.lines + ['<a href="/local/kamera_aufnahmen/' ~ e.dateiname ~ '" target="_blank" rel="noopener">● **' ~ zeit ~ '** — Bewegung erkannt</a>'] %}
              {% endfor %}
              {{ ns.lines | join('\n\n│\n\n') }}
              {% endif %}
            grid_options:
              columns: full
              rows: 4

      - type: grid
        cards:
          - type: picture-entity
            entity: camera.switchbot_outdoor_pan_tilt_cam_3k_secstream
            name: Outdoor
            show_state: false
            grid_options:
              columns: full
              rows: 4
          - type: markdown
            title: Ereignisse Outdoor
            content: >
              {% set events = (state_attr('sensor.kamera_ereignisse', 'events') or [])
                 | selectattr('kamera', 'eq', 'outdoor') | list %}
              {% if events | length == 0 %}
              _Noch keine Ereignisse aufgezeichnet._
              {% else %}
              {% set ns = namespace(lines=[]) %}
              {% for e in events | reverse %}
              {% set zeit = strptime(e.zeit, '%Y-%m-%d_%H-%M-%S').strftime('%d.%m. %H:%M:%S') %}
              {% set ns.lines = ns.lines + ['<a href="/local/kamera_aufnahmen/' ~ e.dateiname ~ '" target="_blank" rel="noopener">● **' ~ zeit ~ '** — Bewegung erkannt</a>'] %}
              {% endfor %}
              {{ ns.lines | join('\n\n│\n\n') }}
              {% endif %}
            grid_options:
              columns: full
              rows: 4

      - type: grid
        cards:
          - type: heading
            heading: Türkontakte
            heading_style: title
          # Ereignishistorie über alle Türkontakte (2026-08-10): native
          # "logbook"-Karte statt eines eigenen Sensors wie bei den Kamera-
          # Ereignissen oben - hier gibt es keine Video-Datei zu verlinken,
          # nur Zustandswechsel (auf/zu, Tamper), dafür reicht HAs eingebautes
          # Logbook. hours_to_show bewusst hoch (7 Tage), weil die Türen nicht
          # ständig auslösen und ein 24h-Fenster oft leer wäre. Haustür
          # Wannsee/Wintergarten sind hier schon mit aufgeführt, obwohl noch
          # nicht gepairt (siehe Kommentar oben) - erscheinen einfach erst,
          # sobald das Pairing nachgeholt ist, kein Fehler bis dahin.
          # Layout 2026-08-10: Logbook wandert von "oben, volle Breite,
          # rows: 4" in eine eigene rechte Spalte neben die 5 Tür-Karten
          # (die dafür in einen vertical-stack links wandern) - dadurch
          # ist die Liste nicht mehr auf 4 feste Grid-Zeilen gedeckelt,
          # sondern nimmt die volle Höhe der linken Spalte ein (5 gestapelte
          # entities-Karten sind deutlich höher als die alten 4 Grid-Zeilen).
          - type: horizontal-stack
            grid_options:
              columns: full
              rows: 10
            cards:
              - type: vertical-stack
                cards:
                  - type: entities
                    title: Söller
                    entities:
                      - entity: binary_sensor.terrasse_tur
                        name: Tür
                      - entity: binary_sensor.terrasse_tamper
                        name: Tamper
                      - entity: sensor.terrasse_batterie
                        name: Batterie
                  - type: entities
                    title: Eingangstür
                    entities:
                      - entity: binary_sensor.eingangstur_tur
                        name: Tür
                      - entity: binary_sensor.eingangstur_tamper
                        name: Tamper
                      - entity: sensor.eingangstur_batterie
                        name: Batterie
                  - type: entities
                    title: Haustür
                    entities:
                      - entity: binary_sensor.haustur_tur
                        name: Tür
                      - entity: binary_sensor.haustur_tamper
                        name: Tamper
                      - entity: sensor.haustur_batterie
                        name: Batterie
                  # Studio (2026-08-29): 6. Kontaktsensor, in CLAUDE.md-Inventar
                  # bislang nicht gelistet. Entity-ID kam generisch als
                  # "contact_sensor_4_*" aus dem Tuya-Pairing und wurde analog
                  # zu den anderen Türen auf "studio_*" umbenannt (Container-
                  # Stopp + direkter core.entity_registry-Edit, gleiches
                  # Verfahren wie bei Bluetooth-Phantom/bitShake-Umbenennung).
                  - type: entities
                    title: Studio
                    entities:
                      - entity: binary_sensor.studio_tur
                        name: Tür
                      - entity: binary_sensor.studio_tamper
                        name: Tamper
                      - entity: sensor.studio_batterie
                        name: Batterie
                  # Haustür Wannsee (2026-09-02): Ursache für das monatelange
                  # Fehlen war keine physische Pairing-Blockade, sondern zwei
                  # getrennte Tuya-Konten (Dresden: E-Mail-Login, Wannsee:
                  # "Bei Apple anmelden" - von Tuya als eigenständiges Konto
                  # behandelt). Fix: Gerät im Wannsee-Konto per Tuya-eigenem
                  # "Gerät teilen" ans Dresden-Konto freigegeben, danach im
                  # Tuya-Cloud-Projekt (iot.tuya.com) neu verknüpft und die
                  # HA-Tuya-Integration neu geladen - kein Entity-Rename nötig,
                  # kam schon sauber als "haustur_wannsee_*" an. KEIN Tamper-
                  # Sensor bei diesem Gerät (anderes Sensor-Modell als die
                  # Dresdner Türen), daher nur Tür + Batterie.
                  - type: entities
                    title: Haustür Wannsee
                    entities:
                      - entity: binary_sensor.haustur_wannsee_tur
                        name: Tür
                      - entity: sensor.haustur_wannsee_batterie
                        name: Batterie
              - type: logbook
                title: Ereignisse Türkontakte
                hours_to_show: 168
                entities:
                  - binary_sensor.terrasse_tur
                  - binary_sensor.terrasse_tamper
                  - binary_sensor.eingangstur_tur
                  - binary_sensor.eingangstur_tamper
                  - binary_sensor.haustur_tur
                  - binary_sensor.haustur_tamper
                  - binary_sensor.studio_tur
                  - binary_sensor.studio_tamper
                  - binary_sensor.haustur_wannsee_tur
